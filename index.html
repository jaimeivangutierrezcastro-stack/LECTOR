<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector QR de Alta Compatibilidad</title>
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; }
        .container { width: 100%; box-sizing: border-box; padding: 10px; }
        #label-estado { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background-color: #007bff; color: white; text-align: center; font-weight: bold; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        #lector-qr { width: 100% !important; border: none !important; border-radius: 8px; overflow: hidden; background-color: #000; }
    </style>
</head>
<body>

    <div class="container">
        <div id="label-estado">Iniciando cámara...</div>
        <div id="lector-qr"></div>
    </div>

<script>
    // REEMPLAZA ESTA URL CON LA DE GOOGLE APPS SCRIPT (MÉTODO 2)
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwZEf8kmBMRgjvdcImNUb0mxxOfjauw6XKCcFKbs_mRxT3HIL5GYuru-WhF_z91NXbh_Q/exec";
    
    let escaneando = true;
    const label = document.getElementById("label-estado");

    function alDetectarCodigo(textoEscaneado) {
        if (!escaneando) return;
        escaneando = false; 
        
        label.innerText = "Procesando código...";
        label.style.backgroundColor = "#ffc107"; 

        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "cors",
            credentials: "include", 
            body: JSON.stringify({ codigo: textoEscaneado }),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                label.innerText = "¡Guardado en Planilla!";
                label.style.backgroundColor = "#28a745"; 
            } else {
                label.innerText = "Error Google: " + data.message;
                label.style.backgroundColor = "#dc3545";
            }
            setTimeout(() => {
                escaneando = true;
                label.innerText = "Listo para escanear código...";
                label.style.backgroundColor = "#007bff";
            }, 3000);
        })
        .catch(error => {
            label.innerText = "Error de red o cuenta de Google.";
            label.style.backgroundColor = "#dc3545";
            setTimeout(() => { escaneando = true; label.innerText = "Listo para escanear..."; label.style.backgroundColor = "#007bff"; }, 3000);
        });
    }

    function iniciarEscaner() {
        // Inicialización nativa directa idéntica a ScanApp
        const html5QrcodeScanner = new Html5Qrcode("lector-qr");
        
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            {
                fps: 10,
                qrbox: (width, height) => { return { width: width * 0.8, height: height * 0.5 }; }
            },
            alDetectarCodigo
        )
        .then(() => {
            label.innerText = "Listo para escanear código...";
        })
        .catch(err => {
            label.innerText = "Error al conectar con la cámara.";
            label.style.backgroundColor = "#dc3545";
        });
    }

    window.addEventListener("DOMContentLoaded", iniciarEscaner);
</script>

</body>
</html>
