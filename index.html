<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Profesional</title>
    <!-- 1. Cargamos la librería oficial optimizada para móviles -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .btn { padding: 15px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; width: 100%; max-width: 400px; margin-bottom: 15px; }
        .btn-blue { background-color: #007bff; }
        .btn-green { background-color: #28a745; }
        
        /* Contenedor del video en vivo */
        #contenedor-lector {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #000;
        }
        
        /* Estilo personalizado para el resultado */
        #resultado {
            margin-top: 15px;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <button class="btn btn-blue" id="estado-txt">Listo para escanear...</button>
    
    <!-- Aquí se renderizará la cámara con su marco de enfoque automáticamente -->
    <div id="contenedor-lector"></div>
    
    <div id="resultado"></div>

    <script>
        let html5QrcodeScanner;

        function iniciarEscaner() {
            // Configuración del escaner
            html5QrcodeScanner = new Html5Qrcode("contenedor-lector");

            const config = { 
                fps: 15, // Cuántas veces por segundo analiza la imagen (15 es ideal para no saturar la RAM)
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    // Define un marco cuadrado dinámico (ej: 250x250 píxeles) centrado en la pantalla
                    let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    let edgeSize = Math.floor(minEdge * 0.6);
                    return { width: edgeSize, height: edgeSize };
                },
                aspectRatio: 1.0 // Fuerza un cuadro perfecto de enfoque
            };

            // Iniciar la cámara trasera ("environment")
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess, // Función si encuentra un QR
                onScanFailure  // Función si está buscando y no encuentra nada en ese cuadro
            ).catch(err => {
                console.error("Error al iniciar cámara web:", err);
                alert("Asegúrate de estar usando HTTPS para poder abrir la cámara en vivo.");
            });
        }

        // Se ejecuta automáticamente EN EL INSTANTE que detecta el QR
        function onScanSuccess(decodedText, decodedResult) {
            // 1. Detenemos la cámara de inmediato para liberar la memoria RAM por completo
            html5QrcodeScanner.stop().then(() => {
                document.getElementById("estado-txt").innerText = "¡Escaneo Exitoso!";
                
                // 2. Mostramos el resultado en pantalla
                const contenedorResultado = document.getElementById("resultado");
                contenedorResultado.style.display = "block";
                contenedorResultado.innerHTML = `<strong>Escrito:</strong> <a href="${decodedText}" target="_blank">${decodedText}</a>`;
                
                console.log(`Código leído: ${decodedText}`);
            }).catch(err => {
                console.error("Error al detener el escaner:", err);
            });
        }

        function onScanFailure(error) {
            // Este bucle corre en silencio mientras busca el QR. 
            // No ponemos alertas aquí para evitar colapsar la pantalla.
        }

        // Iniciar el flujo automáticamente al cargar la página
        window.addEventListener('DOMContentLoaded', iniciarEscaner);
    </script>
</body>
</html>
