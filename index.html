<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Cámara</title>
    <style>
        /* Estilos básicos para centrar y ajustar la cámara */
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; }
        video { width: 100%; max-width: 500px; border-radius: 8px; background: #000; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
        .btn-scan { background-color: #28a745; color: white; }
    </style>
</head>
<body>

    <h2>Listo para escanear...</h2>
    
    <!-- Elemento donde se mostrará la cámara en vivo -->
    <video id="webcam" autoplay playsinline></video>
    
    <br>
    <button class="btn-scan" id="btn-capturar">📸 SACAR FOTO Y ESCANEAR</button>

    <!-- Canvas oculto para procesar la imagen de la foto -->
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const btnCapturar = document.getElementById('btn-capturar');
        const canvas = document.getElementById('canvas');

        // 1. Activar la cámara automáticamente al cargar
        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        // "environment" obliga a usar la cámara trasera del celular
                        facingMode: "environment" 
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (error) {
                alert("Error al acceder a la cámara: " + error.message);
            }
        }

        // 2. Capturar la foto al presionar el botón green
        btnCapturar.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Dibuja el cuadro actual del video en el canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convertir la imagen a formato Base64 (puedes mandarla a un servidor o procesarla)
            const fotoBase64 = canvas.toDataURL('image/jpeg');
            
            console.log("Foto capturada con éxito");
            alert("¡Foto capturada! Ya puedes procesar el escaneo.");
        });

        // Iniciar la cámara al abrir la web
        window.addEventListener('DOMContentLoaded', iniciarCamara);
    </script>
</body>
</html>
