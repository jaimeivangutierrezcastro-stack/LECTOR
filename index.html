<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escaner QR - Control de Resolución</title>
    <!-- Cargamos jsQR desde una red global ultra rápida (CDN) -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        
        /* Contenedor del diseño: Ajusta el tamaño aquí */
        .contenedor-camara { 
            width: 400px; 
            height: 400px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 12px;
            overflow: hidden; /* Corta lo que se salga del cuadrado */
            position: relative;
            background: #000;
        }

        /* Forzamos al video a rellenar el cuadrado sin deformarse */
        video { 
            width: 90%; 
            height: 90%; 
            object-fit: cover; /* Recorta los lados panorámicos para hacerlo cuadrado perfecto */
        }

        /* Estilo para mostrar el texto del QR */
        #cuadro-resultado {
            margin: 20px auto;
            padding: 15px;
            width: 90%;
            max-width: 370px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: none; /* Oculto hasta que lea algo */
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>Escáner en Vivo (Formato Cuadrado)</h2>
    
    <!-- Tu DIV de diseño -->
    <div class="contenedor-camara">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- AQUÍ SE MOSTRARÁ EL TEXTO LÉIDO -->
    <div id="cuadro-resultado" id="resultado-txt">
        Contenido del QR: <span id="texto-qr"></span>
    </div>

    <!-- Canvas oculto en memoria para que jsQR analice los píxeles sin saturar la RAM -->
    <canvas id="canvas-interno" style="display:none;"></canvas>

    <script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('canvas-interno');
const context = canvas.getContext('2d', { willReadFrequently: true });
const cuadroResultado = document.getElementById('cuadro-resultado');
const textoQr = document.getElementById('texto-qr');

// CONFIGURACIÓN DE RENDIMIENTO:
// Analizar la cámara 60 veces por segundo rompe la RAM. 
// Ajustamos un intervalo controlado para analizar solo 6 veces por segundo (cada 150ms).
const INTERVALO_ESCANEO = 150; 
let bucleEscaneo = null;

async function iniciarCamaraEficiente() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment",
                // Forzamos baja resolución de entrada para que la lectura sea instantánea
                width: { ideal: 400 },
                height: { ideal: 300 }
            },
            audio: false
        });
        video.srcObject = stream;
        
        // Iniciar el temporizador controlado en vez de requestAnimationFrame
        bucleEscaneo = setInterval(escanearCuadroOptimizado, INTERVALO_ESCANEO);
    } catch (error) {
        console.error("Error al abrir cámara:", error);
    }
}

function escanearCuadroOptimizado() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // ¡EL TRUCO MAESTRO!: Aplicamos contraste extremo nativo por CSS directo al canvas.
        // Esto binariza la imagen al instante por Hardware (GPU) sin usar bucles "for".
        context.filter = "grayscale(100%) contrast(300%) brightness(90%)";
        
        // Dibujamos el cuadro con el filtro ya aplicado magnéticamente
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Extraemos los datos pre-filtrados sin esfuerzo para el procesador
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        
        // jsQR recibe la imagen perfectamente nítida y limpia
        const codigoIdentificado = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
        });

        if (codigoIdentificado) {
            // Detener el intervalo de inmediato para congelar el consumo de memoria
            clearInterval(bucleEscaneo);
            
            console.log("¡QR SEC Detectado!", codigoIdentificado.data);
            cuadroResultado.style.display = "block";
            textoQr.innerText = codigoIdentificado.data;
            
            detenerCamara(video.srcObject);
        }
    }
}

function detenerCamara(stream) {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
}

window.addEventListener('DOMContentLoaded', iniciarCamaraEficiente);

    </script>
</body>
</html>
