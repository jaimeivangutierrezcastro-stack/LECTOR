<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Barras 1D - Bodega</title>
    
    <!-- Usamos el mismo archivo zxing.js que ya guardaste -->
    <script src="zxing.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #1e1e24; color: #fff; padding: 15px; margin: 0; }
        h2 { color: #fcc419; margin-bottom: 5px; } /* Cambiamos a amarillo para diferenciar la app de bodega */
        .contenedor-camara { 
            width: 320px; height: 320px; margin: 15px auto; 
            border: 4px dashed #fcc419; border-radius: 12px; 
            overflow: hidden; background: #000; position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-panel { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
        button { padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        .btn-blue { background-color: #007bff; }
        .btn-yellow { background-color: #fcc419; color: #111; }
        .btn-red { background-color: #dc3545; }
        .consola-log { margin: 20px auto; width: 90%; max-width: 320px; height: 120px; background: #111; color: #00ff00; font-family: monospace; font-size: 11px; padding: 10px; text-align: left; overflow-y: scroll; border-radius: 6px; }
        #resultado-ok { margin: 15px auto; padding: 12px; max-width: 320px; background-color: #2b8a3e; color: white; border-radius: 6px; display: none; font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>

    <h2>Consola de Bodega (Códigos 1D)</h2>
    
    <div class="contenedor-camara">
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <span id="placeholder-txt" style="color: #666; font-size: 14px; position: absolute; top: 45%; left: 25%;">Cámara Apagada</span>
    </div>

    <div id="resultado-ok">¡BARRAS CAPTURADAS!: <span id="texto-barras"></span></div>

    <div class="btn-panel">
        <button class="btn-blue" onclick="verificarMotorBarras()">1️⃣ PASO: Verificar Motor</button>
        <button class="btn-yellow" id="btn-arrancar" onclick="encenderLectorBarras()" disabled>2️⃣ PASO: Escanear Paquete</button>
        <button class="btn-red" onclick="apagarLectorBarras()">🛑 Apagar Todo</button>
    </div>

    <div class="consola-log" id="consola">
        [Entorno 1D listo] Presiona el PASO 1...
    </div>

    <script>
        const videoElemento = document.getElementById('webcam');
        let codeReader = null;
        let streamActivo = null;

        function agregarLog(msg) {
            const consola = document.getElementById('consola');
            consola.innerHTML += `<br>> ${msg}`;
            consola.scrollTop = consola.scrollHeight;
        }

        function hacerSonidoBip() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(750, audioCtx.currentTime); // Un tono ligeramente distinto para barras
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.12);
            } catch (e) { console.log(e); }
        }

        function verificarMotorBarras() {
            if (typeof ZXing !== 'undefined') {
                agregarLog("¡ÉXITO! Motor listo para decodificar formatos 1D.");
                document.getElementById('btn-arrancar').disabled = false;
                document.getElementById('placeholder-txt').innerText = "Listo para escanear etiquetas";
            } else {
                agregarLog("ERROR: Asegúrate de que el archivo zxing.js esté en la misma carpeta.");
            }
        }

        async function encenderLectorBarras() {
    agregarLog("Activando cámara para códigos alargados...");
    document.getElementById('placeholder-txt').style.display = "none";
    videoElemento.style.display = "block";

    try {
        // Instanciamos el lector base
        codeReader = new ZXing.BrowserMultiFormatReader();

        // 1. CREACIÓN DE HINTS DE ALTO RENDIMIENTO PARA EAN-13
        const hints = new Map();
        
        // Indicamos los formatos específicos de barra a buscar
        const formatosBarras = [
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.EAN_8,
            ZXing.BarcodeFormat.CODE_128 // Mantenemos el estándar logístico
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatosBarras);

        // 🚀 EL CAMBIO CLAVE: Activamos "TRY_HARDER" 
        // Esto le dice al procesador que gaste más recursos en calcular líneas delgadas y borrosas
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        // Inyectamos las propiedades al motor analítico antes del stream
        codeReader.hints = hints;

        // 2. SOLICITUD DE VIDEO EQUILIBRADA
        // Nota: Si la cámara es el "artilugio" antiguo de PC, 1280x720 puede ser una resolución irreal 
        // y el sistema la deforma. Usamos un formato estándar estable:
        streamActivo = await navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "environment", 
                width: { ideal: 1280 }, 
                height: { ideal: 720 } 
            }, 
            audio: false
        });
        
        videoElemento.srcObject = streamActivo;
        agregarLog("Modo de escaneo profundo EAN-13 Activado.");

        // Ejecutar lectura continua
        codeReader.decodeFromVideoElement(videoElemento, (resultado, error) => {
            if (resultado) {
                hacerSonidoBip();
                agregarLog(`¡CÓDIGO CAPTURADO!: ${resultado.text}`);
                
                document.getElementById("resultado-ok").style.display = "block";
                document.getElementById("texto-barras").innerText = resultado.text;
                
                apagarLectorBarras();
            }
        });

    } catch (err) {
        agregarLog(`ERROR: ${err.message}`);
    }
}

        function apagarLectorBarras() {
            if (codeReader) codeReader.reset();
            if (streamActivo) streamActivo.getTracks().forEach(track => track.stop());
            videoElemento.style.display = "none";
            document.getElementById('placeholder-txt').style.display = "block";
            document.getElementById('placeholder-txt').innerText = "Cámara Apagada";
        }
    </script>
</body>
</html>
