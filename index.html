<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Ultra Rápido</title>
    <!-- Usamos la librería definitiva optimizada para bajo rendimiento -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        
        /* Tu contenedor del diseño en formato cuadrado */
        .contenedor-camara { 
            width: 350px; 
            height: 350px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        /* Ajustes para el texto leído */
        #cuadro-resultado {
            margin: 20px auto;
            padding: 15px;
            width: 90%;
            max-width: 320px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>Escaneando Código...</h2>
    
    <!-- Aquí se inyectará la cámara automáticamente -->
    <div class="contenedor-camara" id="lector-webcam"></div>

    <!-- Muestra del texto final -->
    <div id="cuadro-resultado">
        Contenido: <span id="texto-qr"></span>
    </div>

    <script>
        let html5QrCode;

        async function iniciarEscaneoProfesional() {
            // Inicializamos la librería sobre tu DIV de diseño
            html5QrCode = new Html5Qrcode("lector-webcam");

            const config = {
                fps: 10, // Analiza solo 10 cuadros por segundo para que el celular y la PC vieja vayan ultra fluidos
                qrbox: function(width, height) {
                    // Crea un área de enfoque interna para obligar al algoritmo a concentrarse en el centro
                    return { width: Math.floor(width * 0.7), height: Math.floor(height * 0.7) };
                },
                // Forzamos una resolución nativa baja para que el motor matemático no se sature
                videoConstraints: {
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            // Arrancamos la cámara trasera (o la webcam por defecto en PC)
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess, // Si encuentra el QR
                onScanFailure  // Si sigue buscando en silencio
            ).catch(err => {
                console.error("Error al iniciar el escáner:", err);
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            // ¡LEÍDO! Detenemos la cámara de inmediato para liberar el 100% de la RAM
            html5QrCode.stop().then(() => {
                console.log("Código leído correctamente.");
                
                // Pintamos el resultado en tu HTML
                document.getElementById("cuadro-resultado").style.display = "block";
                document.getElementById("texto-qr").innerText = decodedText;
            }).catch(err => {
                console.error("Error al detener la cámara:", err);
            });
        }

        function onScanFailure(error) {
            // Deja este bloque vacío para que no genere lag con logs repetitivos
        }

        // Cargar al iniciar la web
        window.addEventListener('DOMContentLoaded', iniciarEscaneoProfesional);
    </script>
</body>
</html>
