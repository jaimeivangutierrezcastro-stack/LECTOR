<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escaner QR - Control de Resolución</title>
    <!-- Cargamos jsQR desde una red global ultra rápida (CDN) -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        
        /* Contenedor del diseño: Ajusta el tamaño aquí */
        .contenedor-camara { 
            width: 400px; 
            height: 400px; 
            margin: 0 auto; 
            border: 4px solid #333; 
            border-radius: 12px;
            overflow: hidden; /* Corta lo que se salga del cuadrado */
            position: relative;
            background: #000;
        }

        /* Forzamos al video a rellenar el cuadrado sin deformarse */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Recorta los lados panorámicos para hacerlo cuadrado perfecto */
        }

        /* Estilo para mostrar el texto del QR */
        #cuadro-resultado {
            margin: 20px auto;
            padding: 15px;
            width: 90%;
            max-width: 370px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: none; /* Oculto hasta que lea algo */
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>Escáner en Vivo (Formato Cuadrado)</h2>
    
    <!-- Tu DIV de diseño -->
    <div class="contenedor-camara">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <!-- AQUÍ SE MOSTRARÁ EL TEXTO LÉIDO -->
    <div id="cuadro-resultado" id="resultado-txt">
        Contenido del QR: <span id="texto-qr"></span>
    </div>

    <!-- Canvas oculto en memoria para que jsQR analice los píxeles sin saturar la RAM -->
    <canvas id="canvas-interno" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas-interno');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        const cuadroResultado = document.getElementById('cuadro-resultado');
        const textoQr = document.getElementById('texto-qr');

        async function iniciarCamaraPC() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        // CORRECCIÓN DE RESOLUCIÓN: Forzamos un formato estándar 4:3 (640x480) 
                        // en lugar de resoluciones panorámicas HD (16:9) que congelan la RAM
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                
                // Iniciamos el bucle de lectura automática en vivo
                requestAnimationFrame(escanearCuadro);
            } catch (error) {
                alert("Error al abrir cámara: " + error.message);
            }
        }

        function escanearCuadro() {
            // Validamos que el video tenga datos reales cargados antes de dibujar
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                
                // Mantenemos la resolución interna baja (640x480) para un análisis ultra rápido
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Volcamos el cuadro actual del video al canvas oculto
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Extraemos los píxeles puros
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                
                // La librería jsQR analiza los píxeles en tiempo real
                const codigoIdentificado = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert", // Ahorra procesador omitiendo QR invertidos
                });

                // Si la librería encuentra un código válido:
                if (codigoIdentificado) {
                    console.log("¡QR Detectado!", codigoIdentificado.data);
                    
                    // MOSTRAR EL TEXTO EN LA PÁGINA WEB
                    cuadroResultado.style.display = "block";
                    textoQr.innerText = codigoIdentificado.data;
                    
                    // Detener la cámara inmediatamente para no saturar la memoria
                    detenerCamara(video.srcObject);
                    return; // Rompe el bucle de escaneo
                }
            }
            
            // Si no encuentra nada, sigue analizando el siguiente cuadro en vivo
            requestAnimationFrame(escanearCuadro);
        }

        function detenerCamara(stream) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                console.log("Cámara apagada. Memoria liberada.");
            }
        }

        // Arrancar el proceso al abrir la web
        window.addEventListener('DOMContentLoaded', iniciarCamaraPC);
    </script>
</body>
</html>
