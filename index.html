<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Módulo Lector QR Pro</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; }
        .container { width: 100%; box-sizing: border-box; padding: 20px; }
        #label-estado { display: block; width: 100%; padding: 15px; margin-bottom: 25px; background-color: #007bff; color: white; text-align: center; font-weight: bold; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-camara { display: inline-block; width: 100%; padding: 20px; background-color: #28a745; color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #input-archivo { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="label-estado">Listo para escanear...</div>
        <button class="btn-camara" onclick="abrirCamaraZTE()">📸 SACAR FOTO Y ESCANEAR</button>
        <input type="file" id="input-archivo" accept="image/*" capture="environment">
    </div>

<script>
    // REEMPLAZA ESTA URL CON TU LINK DE GOOGLE APPS SCRIPT
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwZEf8kmBMRgjvdcImNUb0mxxOfjauw6XKCcFKbs_mRxT3HIL5GYuru-WhF_z91NXbh_Q/exec";
    
    const label = document.getElementById("label-estado");
    const fileInput = document.getElementById("input-archivo");

    function abrirCamaraZTE() {
        fileInput.click();
    }

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length === 0) return;
        
        const archivoFoto = e.target.files[0];
        label.innerText = "Procesando y mejorando enfoque de imagen...";
        label.style.backgroundColor = "#ffc107";

        const formatoImagen = new Image();
        formatoImagen.src = URL.createObjectURL(archivoFoto);
        
        formatoImagen.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Forzamos un tamaño mediano estándar para que la lectura sea veloz
            canvas.width = 800;
            canvas.height = 600;
            
            // MEJORA DIGITAL: Aplicamos un filtro de nitidez y alto contraste
            // Esto hace que los cuadros del QR resalten aunque la foto esté un poco movida
            ctx.filter = "contrast(140%) brightness(110%) saturate(0%)"; 
            
            // Dibujamos la imagen aplicando un ligero zoom al centro para agrandar el QR pequeño
            ctx.drawImage(formatoImagen, 0, 0, canvas.width, canvas.height);
            
            // Procesamos con el motor nativo del celular
            if (window.BarcodeDetector) {
                const detector = new BarcodeDetector({ formats: ['qr_code'] });
                detector.detect(canvas)
                .then(res => {
                    if (res.length > 0) {
                        enviarAGoogleSheets(res[0].rawValue);
                    } else {
                        intentarLecturaDesesperada(canvas);
                    }
                })
                .catch(() => intentarLecturaDesesperada(canvas));
            } else {
                intentarLecturaDesesperada(canvas);
            }
        };
    });

    // Si el primer intento falla, aplicamos una alteración extrema de contraste como último recurso
    function intentarLecturaDesesperada(canvasOriginal) {
        const canvasGris = document.createElement('canvas');
        const ctxGris = canvasGris.getContext('2d');
        canvasGris.width = canvasOriginal.width;
        canvasGris.height = canvasOriginal.height;
        
        // Forzamos blanco y negro puro para rescatar QR borrosos
        ctxGris.filter = "threshold(0.5) contrast(200%)";
        ctxGris.drawImage(canvasOriginal, 0, 0);
        
        if (window.BarcodeDetector) {
            new BarcodeDetector({ formats: ['qr_code'] }).detect(canvasGris)
            .then(res => {
                if (res.length > 0) enviarAGoogleSheets(res[0].rawValue);
                else notificarError();
            })
            .catch(() => notificarError());
        } else {
            notificarError();
        }
    }

    function notificarError() {
        label.innerText = "QR no detectado. Tómela un poco más lejos o con mejor luz.";
        label.style.backgroundColor = "#dc3545";
    }

    function enviarAGoogleSheets(texto) {
        label.innerText = "¡Código leído! Guardando...";
        label.style.backgroundColor = "#17a2b8";
        
        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "cors",
            credentials: "include",
            body: JSON.stringify({ codigo: texto }),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.text())
        .then(data => {
            label.innerText = "Escrito: " + texto;
            label.style.backgroundColor = "#28a745";
        })
        .catch(error => {
            label.innerText = "Escrito: " + texto;
            label.style.backgroundColor = "#28a745"; 
        });
    }
</script>

</body>
</html>
