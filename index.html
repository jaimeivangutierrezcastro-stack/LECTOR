<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner QR - Botón Nativo</title>
    <!-- Cargamos la librería para decodificar fotos -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; }
        .container { width: 100%; box-sizing: border-box; padding: 20px; }
        #label-estado { display: block; width: 100%; padding: 15px; margin-bottom: 20px; background-color: #007bff; color: white; text-align: center; font-weight: bold; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        
        /* Botón grande para el celular */
        .btn-camara {
            display: inline-block;
            width: 100%;
            padding: 20px;
            background-color: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Ocultamos el input de archivo feo del navegador */
        #input-archivo { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="label-estado">Listo para escanear...</div>
        
        <!-- Botón que activa la cámara del celular -->
        <button class="btn-camara" onclick="activarCamaraNativa()">📸 ABRIR CÁMARA Y ESCANEAR</button>
        
        <!-- Input oculto que captura la foto de la cámara -->
        <input type="file" id="input-archivo" accept="image/*" capture="environment">
    </div>

<script>
    // REEMPLAZA ESTA URL CON TU LINK DE GOOGLE APPS SCRIPT
    const URL_GOOGLE_SCRIPT = "TU_URL_DE_GOOGLE_SHEETS";
    
    const label = document.getElementById("label-estado");
    const fileInput = document.getElementById("input-archivo");
    const html5QrCode = new Html5Qrcode("label-estado"); // Usamos el label como puente invisible

    function activarCamaraNativa() {
        fileInput.click(); // Fuerza al celular a abrir su cámara nativa
    }

    // Escuchar cuando el usuario toma la foto y la acepta
    fileInput.addEventListener('change', e => {
        if (e.target.files.length === 0) return;
        
        const archivoImagen = e.target.files[0];
        label.innerText = "Procesando imagen del código...";
        label.style.backgroundColor = "#ffc107";

        // La librería lee la foto que acabas de tomar
        html5QrCode.scanFile(archivoImagen, true)
        .then(textoEscaneado => {
            enviarAGoogle(textoEscaneado);
        })
        .catch(err => {
            label.innerText = "No se detectó ningún QR claro. Intente otra foto.";
            label.style.backgroundColor = "#dc3545";
        });
    });

    function enviarAGoogle(texto) {
        label.innerText = "Guardando en Google Sheets...";
        
        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "cors",
            credentials: "include",
            body: JSON.stringify({ codigo: texto }),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                label.innerText = "¡Guardado con éxito!";
                label.style.backgroundColor = "#28a745";
            } else {
                label.innerText = "Error: " + data.message;
                label.style.backgroundColor = "#dc3545";
            }
        })
        .catch(error => {
            label.innerText = "Error de red o permisos de cuenta Google.";
            label.style.backgroundColor = "#dc3545";
        });
    }
</script>

</body>
</html>
