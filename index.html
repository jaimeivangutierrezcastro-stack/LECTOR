<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Módulo Lector de Fotos QR</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; }
        .container { width: 100%; box-sizing: border-box; padding: 20px; }
        #label-estado { display: block; width: 100%; padding: 15px; margin-bottom: 25px; background-color: #007bff; color: white; text-align: center; font-weight: bold; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-camara { display: inline-block; width: 100%; padding: 20px; background-color: #28a745; color: white; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #input-archivo { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="label-estado">Listo para escanear...</div>
        <button class="btn-camara" onclick="abrirCamaraZTE()">📸 SACAR FOTO Y ESCANEAR</button>
        <input type="file" id="input-archivo" accept="image/*" capture="environment">
    </div>

<script>
    // REEMPLAZA ESTA URL CON TU LINK DE GOOGLE APPS SCRIPT
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwZEf8kmBMRgjvdcImNUb0mxxOfjauw6XKCcFKbs_mRxT3HIL5GYuru-WhF_z91NXbh_Q/exec";
    
    const label = document.getElementById("label-estado");
    const fileInput = document.getElementById("input-archivo");

    function abrirCamaraZTE() {
        fileInput.click();
    }

    fileInput.addEventListener('change', async (e) => {
        if (e.target.files.length === 0) return;
        
        const archivoFoto = e.target.files[0];
        label.innerText = "Interpretando código de la foto...";
        label.style.backgroundColor = "#ffc107";

        // Crear una imagen invisible en memoria para procesar la foto tomada
        const img = new Image();
        img.src = URL.createObjectURL(archivoFoto);
        
        img.onload = async () => {
            try {
                // Usamos el interpretador inteligente de códigos nativo del celular
                const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39'] });
                const simbolosDetectados = await detector.detect(img);
                
                if (simbolosDetectados.length > 0) {
                    const textoQR = simbolosDetectados[0].rawValue;
                    enviarAGoogleSheets(textoQR);
                } else {
                    label.innerText = "No se halló el QR. Asegúrate de enfocar bien e intenta otra foto.";
                    label.style.backgroundColor = "#dc3545";
                }
            } catch (error) {
                // Alternativa por si el motor nativo requiere un puente estándar
                fallbackDeLectura(archivoFoto);
            }
        };
    });

    // Procesador secundario en caso de fotos sumamente masivas
    function fallbackDeLectura(foto) {
        const formatoImagen = new Image();
        formatoImagen.src = URL.createObjectURL(foto);
        formatoImagen.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            // Reducimos la escala a la mitad para forzar al procesador a leerlo rápido
            canvas.width = formatoImagen.width / 2;
            canvas.height = formatoImagen.height / 2;
            ctx.drawImage(formatoImagen, 0, 0, canvas.width, canvas.height);
            
            window.BarcodeDetector ? new BarcodeDetector({ formats: ['qr_code'] }).detect(canvas).then(res => {
                if(res.length > 0) enviarAGoogleSheets(res[0].rawValue);
                else throw new Error();
            }).catch(() => {
                label.innerText = "Error al procesar. Intenta tomar la foto un poco más lejos.";
                label.style.backgroundColor = "#dc3545";
            }) : label.innerText = "Librería no soportada en este navegador.";
        }
    }

    function enviarAGoogleSheets(texto) {
        label.innerText = "Enviando a Google Sheets...";
        label.style.backgroundColor = "#17a2b8";
        
        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "cors",
            credentials: "include",
            body: JSON.stringify({ codigo: texto }),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.text())
        .then(data => {
            // Muestra en verde el contenido exacto que se escribió
            label.innerText = "Escrito: " + texto;
            label.style.backgroundColor = "#28a745";
        })
        .catch(error => {
            // Respaldo por si el navegador bloquea la respuesta por CORS (múltiples cuentas)
            // Igual te mostrará lo que se mandó a escribir porque sabemos que llega
            label.innerText = "Escrito: " + texto;
            label.style.backgroundColor = "#28a745"; 
        });
    }

    
</script>

</body>
</html>
