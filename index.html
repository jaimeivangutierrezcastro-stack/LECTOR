<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Módulo Biblioteca - Escáner QR</title>
    <!-- Cargamos la biblioteca de escaneo de forma segura -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }
        .container {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }
        /* Especificación: Label para leer el estado del escáner */
        #label-estado {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #007bff;
            color: white;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            box-sizing: border-box;
        }
        /* Especificación: Todo el ancho del celular */
        #lector-qr {
            width: 100% !important;
            border: none !important;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Label informativo -->
        <div id="label-estado">Buscando cámara...</div>
        
        <!-- Contenedor del escáner (Ocupa todo el ancho) -->
        <div id="lector-qr"></div>
    </div>

<script>
    // REEMPLAZA ESTA URL por la que te entregó Google Apps Script en el Método 2
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwZEf8kmBMRgjvdcImNUb0mxxOfjauw6XKCcFKbs_mRxT3HIL5GYuru-WhF_z91NXbh_Q/exec";

    let escaneando = true;
    const label = document.getElementById("label-estado");

    function alDetectarCodigo(textoEscaneado) {
        if (!escaneando) return;
        escaneando = false; // Detiene temporalmente la lectura para evitar duplicados
        
        label.innerText = "Procesando código...";
        label.style.backgroundColor = "#ffc107"; // Color amarillo de espera

        // Enviar el string completo y crudo a la planilla de Google
        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            mode: "cors",
            credentials: "include", // Requerido para la autenticación del Método 2
            body: JSON.stringify({ codigo: textoEscaneado }),
            headers: { "Content-Type": "text/plain" }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                label.innerText = "¡Guardado con éxito!";
                label.style.backgroundColor = "#28a745"; // Color verde de éxito
            } else {
                label.innerText = "Error: " + data.message;
                label.style.backgroundColor = "#dc3545";
            }
            // Reactivar el escáner después de 3 segundos para la siguiente lectura
            setTimeout(() => {
                escaneando = true;
                label.innerText = "Listo para escanear código...";
                label.style.backgroundColor = "#007bff";
            }, 3000);
        })
        .catch(error => {
            label.innerText = "Error de red/permisos.";
            label.style.backgroundColor = "#dc3545";
            setTimeout(() => { escaneando = true; }, 3000);
        });
    }

    // Inicializar el lector de códigos QR y barras en tiempo real
       // Inicializador ultra-compatible para teléfonos con múltiples cámaras de alta resolución
    function iniciarEscaner() {
        const html5QrcodeScanner = new Html5Qrcode("lector-qr");
        
        // Configuraciones de compatibilidad para cámaras modernas (ZTE)
        const configuracionLector = {
            fps: 15, // Aumentamos los cuadros por segundo para mejorar la velocidad
            qrbox: (width, height) => { 
                return { width: width * 0.8, height: height * 0.4 }; 
            },
            // Forzamos resoluciones estándar de video para evitar que fallen los sensores de 108MP
            videoConstraints: {
                facingMode: "environment",
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        };

        // Arrancamos directamente usando el modo entorno (cámara trasera) con los límites de video activos
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            configuracionLector,
            alDetectarCodigo
        )
        .then(() => {
            label.innerText = "Listo para escanear código...";
            label.style.backgroundColor = "#007bff";
        })
        .catch(err => {
            console.error("Fallo inicial, intentando método de respaldo por IDs...", err);
            // Si el modo genérico falla, listamos los sensores traseros manualmente
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    // Seleccionamos el primer sensor disponible (usualmente el principal)
                    html5QrcodeScanner.start(
                        devices[0].id,
                        { fps: 10, qrbox: (width, height) => { return { width: width * 0.8, height: height * 0.5 }; } },
                        alDetectarCodigo
                    )
                    .then(() => {
                        label.innerText = "Listo para escanear (Modo Respaldo)...";
                    })
                    .catch(errFinal => {
                        label.innerText = "Error: Sensores de cámara ocupados o no soportados.";
                        label.style.backgroundColor = "#dc3545";
                    });
                }
            }).catch(e => {
                label.innerText = "No se detectaron cámaras traseras compatibles.";
                label.style.backgroundColor = "#dc3545";
            });
        });
    }

    // Iniciar automáticamente
    window.addEventListener("DOMContentLoaded", iniciarEscaner);

   
</script>

</body>
</html>
